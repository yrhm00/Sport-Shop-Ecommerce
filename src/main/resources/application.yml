server:
  port: ${SERVER_PORT:8443}
  servlet:
    context-path: /janvier
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    session:
      cookie:
        http-only: true   # cookie de session inaccessible au JavaScript (anti-vol de session par XSS)
        secure: true      # cookie transmis uniquement sur HTTPS
  # TLS : certificat auto-signe genere avec keytool (voir README.md).
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:ChangeMe2026}
    key-alias: jogginapp

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/janvier_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  sql:
    init:
      mode: always
      encoding: UTF-8
# Identifiants PayPal : jamais en clair dans le depot.
# A definir dans l'environnement avant de lancer l'application (voir README.md).
paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  mode: ${PAYPAL_MODE:sandbox}

logging:
  level:
    be.henallux.janvier: INFO
